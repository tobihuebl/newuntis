name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sp
          POSTGRES_PASSWORD: sp
          POSTGRES_DB: schulplattform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sp -d schulplattform"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sp:sp@localhost:5432/schulplattform
      DATABASE_APP_URL: postgresql://sp_app:sp_app@localhost:5432/schulplattform
      BASE_DOMAIN: localhost
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      SESSION_SECRET: ci-only-secret-with-at-least-32-chars!!
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      SMTP_URL: smtp://localhost:1025
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: schulplattform
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lieferkette: bekannte Schwachstellen ab "high" in Produktionsabhängigkeiten brechen den Build ab
      - run: pnpm audit --prod --audit-level high
      # Design System: erzeugte Token-Dateien müssen zu docs/design-system/tokens.json passen
      - run: pnpm design:check
      # Token-Lint (keine Rohwerte) und Kontrast der Token-Paare (docs/kontrast.md muss aktuell sein)
      - run: pnpm design:lint
      - run: node scripts/check-contrast.mjs --check
      - run: pnpm db:generate
      - run: pnpm --filter @sp/db migrate:deploy
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Playwright gegen eigene Postgres-Instanz (Testcontainers), API und Web als Produktions-Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @sp/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      # Design-Screenshots hell/dunkel × 390/1280 (e2e/design.spec.ts) zur Durchsicht
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-screenshots
          path: apps/web/test-results/design
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    # Docker-Images für den Betrieb bauen (infra/Dockerfile). Veröffentlichen und Ausrollen folgen mit dem Server.
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [api, web, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
